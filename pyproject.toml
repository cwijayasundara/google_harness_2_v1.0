[project]
name = "harness-clone"
version = "0.1.0"
description = "Recursive harness optimization with Deep Agents and Pi Durable"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.12,<3", "deepagents>=0.6.12,<0.8", "langgraph>=1.2,<2", "langchain-fireworks>=1.1,<2", "httpx>=0.28,<1", "pyyaml>=6,<7"]

[project.scripts]
harness-clone = "harness_clone.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness_clone"]

[dependency-groups]
dev = ["pytest>=9,<10", "ruff>=0.15,<0.16"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["docker: requires an accessible Docker daemon"]

[tool.ruff]
line-length = 100
target-version = "py312"

